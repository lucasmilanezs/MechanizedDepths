name: Publish playtest channel

on:
  push:
    branches:
      - 'release/pt-*'
    tags:
      - 'pt-*'
concurrency:
  group: mechanized-depths-playtest-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - name: Check out repository, release families, and named tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve tagged versions and current family head
        id: release
        shell: bash
        run: |
          git fetch --prune origin '+refs/heads/release/pt-*:refs/remotes/origin/release/pt-*' '+refs/tags/pt-*:refs/tags/pt-*'
          python packaging/tools/resolve_playtest.py --output builds/release-heads.json
          echo "version=$(python -c 'import json; print(json.load(open("builds/release-heads.json"))["active"])')" >> "$GITHUB_OUTPUT"
          echo "revision=$(python -c 'import json; print(json.load(open("builds/release-heads.json"))["releases"][0]["revision"])')" >> "$GITHUB_OUTPUT"
      - name: Check out current named release
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.revision }}
        run: git checkout --detach "$RELEASE_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install pinned packwiz
        run: go install github.com/packwiz/packwiz@v0.0.0-20260906154125-ef87d964f8cb
      - name: Build current playtest pack
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.revision }}
        run: |
          label="${RELEASE_VERSION}+g${RELEASE_SHA:0:12}"
          python packaging/tools/build_pack.py --version "$label" --require-clean --export-curseforge --packwiz "$(go env GOPATH)/bin/packwiz"
      - name: Stage Pages site
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.revision }}
        run: |
          label="${RELEASE_VERSION}+g${RELEASE_SHA:0:12}"
          python packaging/tools/stage_playtest.py \
            --pack-dir "builds/packwiz/${label}-${RELEASE_SHA:0:12}" \
            --report "builds/packwiz/${label}-${RELEASE_SHA:0:12}.report.json" \
            --releases builds/release-heads.json \
            --prism-profile packaging/prism-profile.json \
            --curseforge-export "builds/packwiz/MechanizedDepths-${label}-CurseForge.zip" \
            --output builds/pages-site
      - uses: actions/configure-pages@v5
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: builds/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public playtest channel
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ needs.build.outputs.revision }}
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import PurePosixPath
          import time
          import tomllib
          import zipfile
          from urllib.parse import urljoin
          from urllib.request import urlopen

          base = os.environ["PAGE_URL"].rstrip("/") + "/"
          expected_revision = os.environ["RELEASE_SHA"]

          def fetch(path):
              with urlopen(urljoin(base, path), timeout=20) as response:
                  return response.read()

          for attempt in range(12):
              try:
                  catalog = json.loads(fetch("catalog.json"))
                  if catalog["releases"][0]["revision"] != expected_revision:
                      raise RuntimeError("catalog still points to an older revision")
                  index = fetch("playtest/index.toml")
                  if hashlib.sha256(index).hexdigest() != catalog["indexSHA256"]:
                      raise RuntimeError("public index hash differs from catalog")
                  export_data = fetch(catalog["curseforgeExport"])
                  if hashlib.sha256(export_data).hexdigest() != catalog["curseforgeExportSHA256"]:
                      raise RuntimeError("CurseForge export hash differs from catalog")
                  with zipfile.ZipFile(io.BytesIO(export_data)) as archive:
                      if archive.testzip() is not None:
                          raise RuntimeError("downloaded CurseForge ZIP is corrupt")
                      manifest = json.loads(archive.read("manifest.json"))
                      if (manifest["version"] != catalog["packwizVersion"]
                              or manifest["version"] != catalog["curseforgeExportVersion"]
                              or manifest["manifestType"] != "minecraftModpack"):
                          raise RuntimeError("public CurseForge manifest differs from current pack")
                  profile_data = fetch(catalog["prismProfile"])
                  if hashlib.sha256(profile_data).hexdigest() != catalog["prismProfileSHA256"]:
                      raise RuntimeError("Prism profile hash differs from catalog")
                  with zipfile.ZipFile(io.BytesIO(profile_data)) as profile:
                      if profile.testzip() is not None:
                          raise RuntimeError("downloaded Prism profile ZIP is corrupt")
                      required = {"instance.cfg", "mmc-pack.json", "minecraft/packwiz-installer-bootstrap.jar"}
                      if not required.issubset(profile.namelist()):
                          raise RuntimeError("Prism profile is missing required import files")
                      instance_cfg = profile.read("instance.cfg").decode()
                      if ("packwiz-installer-bootstrap.jar" not in instance_cfg
                              or "$INST_MC_DIR" not in instance_cfg or "-s client" not in instance_cfg):
                          raise RuntimeError("Prism profile does not configure its Packwiz pre-launch command")
                      if ("OverrideMemory=true" not in instance_cfg
                              or "MinMemAlloc=1024" not in instance_cfg
                              or "MaxMemAlloc=8192" not in instance_cfg):
                          raise RuntimeError("Prism profile does not configure the playtest memory allocation")
                      profile_manifest = json.loads(profile.read("profile-manifest.json"))
                      if (profile_manifest["profileVersion"] != catalog["prismProfileVersion"]
                              or profile_manifest["recommendedJavaMemoryMiB"] != 8192):
                          raise RuntimeError("Prism profile metadata differs from the pinned profile")
                  paths = [item["file"] for item in tomllib.loads(index.decode())["files"]]
                  if any(part.startswith(".") for path in paths
                         for part in PurePosixPath(path).parts):
                      raise RuntimeError("packwiz index contains hidden URLs")
                  fetch("playtest/kubejs/probe/user/directory.keep")
                  print(f"Verified {catalog['active']} at {expected_revision}")
                  break
              except Exception as error:
                  if attempt == 11:
                      raise
                  print(f"Waiting for Pages propagation: {error}", flush=True)
                  time.sleep(10)
          PY
